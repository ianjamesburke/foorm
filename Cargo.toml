[package]
name = "foorm"
version = "0.1.0"
edition = "2024"
description = "ASCII visualizer for nooise: consumes OSC, gives sound a shape"
license = "MIT"
repository = "https://github.com/ianjamesburke/foorm"

[[bin]]
name = "foorm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
rosc = "0.11"
